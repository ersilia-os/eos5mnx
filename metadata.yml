Title: SAND Shape-Aware Descriptor
Description: SAND compresses a molecule's three-dimensional shape into 512 numbers
  without generating a single conformer. Winter and colleagues at Pfizer trained a
  GINE graph neural network with a rank-preserving contrastive objective, so cosine
  similarity between the L2-normalised embeddings tracks ROCS shape overlap with a
  correlation of 0.86. That makes shape-based screening tractable across libraries
  of billions of compounds. Ersilia serves the uncompressed embedding rather than
  the quantised search index, and the vector approximates rather than computes the
  underlying geometry.
