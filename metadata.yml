Title: SAND Shape-Aware Descriptor
Description: SAND compresses a molecule's three-dimensional shape into 512 features without generating a single conformer. Winter and colleagues at Pfizer trained the model to reproduce shape similarity computed from explicit 3D alignment, so that the expensive conformational sampling normally required for shape-based screening is replaced by one pass over the 2D graph. This makes shape comparison tractable across libraries of billions of compounds, at the cost of approximating rather than computing the underlying geometry.
