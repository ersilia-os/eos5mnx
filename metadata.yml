Status: In progress
Title: SAND Shape-Aware Descriptor
Description: SAND (Shape Aware Neural Descriptor) turns a molecules 2D structure
  into a compact fixed-length embedding that captures its 3D shape without 
  generating any conformers. The resulting vector enables rapid retrieval of 
  shape-similar molecules for ligand-based virtual screening, and serves as a 
  general-purpose descriptor for downstream similarity search and 
  property-prediction tasks. Trained by Pfizer (ICML 2026); GINE graph encoder 
  producing a 512-dimensional embedding whose cosine similarity approximates 3D 
  shape overlap.
